name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [bot, plugin-sdk, plugin-wire, ui, voice]
    steps:
      - uses: actions/checkout@v4

      # action-setup reads the pinned pnpm version from package.json's
      # packageManager field, so it stays in lockstep with local dev.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # .npmrc forces native modules (sqlite3, @discordjs/opus) to build
      # from source; the ubuntu-latest runner ships the gcc/python3
      # toolchain that needs, so no extra setup step is required.
      - run: pnpm install --frozen-lockfile

      - name: Build & test plugin-sdk
        if: matrix.target == 'plugin-sdk'
        # `...` builds the workspace deps (plugin-wire) before the SDK, so
        # the SDK's tsc-based tests can resolve @karyl-chan/plugin-wire from
        # its built dist. (The SDK build itself inlines plugin-wire from
        # source via the tsconfig path alias and needs no prior dist.)
        run: |
          pnpm --filter "@karyl-chan/plugin-sdk..." build
          pnpm --filter @karyl-chan/plugin-sdk test

      - name: Build & test plugin-wire
        if: matrix.target == 'plugin-wire'
        # Its own cell rather than a step under plugin-sdk: plugin-wire owns
        # the register-time rejection rules both sides run, so a break here
        # should name plugin-wire, not read as an SDK failure.
        run: |
          pnpm --filter @karyl-chan/plugin-wire build
          pnpm --filter @karyl-chan/plugin-wire test

      - name: Typecheck & test ui
        if: matrix.target == 'ui'
        # @karyl-chan/ui ships raw .vue/.ts source (no build step), so its
        # gate is vue-tsc plus the colocated vitest specs (jsdom).
        run: |
          pnpm --filter @karyl-chan/ui typecheck
          pnpm --filter @karyl-chan/ui test

      - name: Build & test voice
        if: matrix.target == 'voice'
        # `...` builds the workspace deps (plugin-sdk) before voice.
        run: |
          pnpm --filter "@karyl-chan/voice..." build
          pnpm --filter @karyl-chan/voice test

      - name: Build & test bot
        if: matrix.target == 'bot'
        # `...` builds the bot's workspace deps (voice → plugin-sdk) first;
        # without it the bot's tsc can't resolve their types.
        run: |
          pnpm --filter "@karyl-chan/bot..." build
          pnpm --filter @karyl-chan/bot test:typecheck
          pnpm --filter @karyl-chan/bot test
          pnpm --filter karyl-chan-frontend build
          pnpm --filter karyl-chan-frontend test

  plugin-platform-e2e:
    runs-on: ubuntu-latest
    name: plugin-platform-e2e
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: karyl_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d karyl_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      BOT_SKIP_DISCORD: "true"
      TEST_E2E_REQUIRED: "1"
      TEST_CHAOS: "1"
      TEST_E2E_DB_URL: postgres://postgres:e2e@127.0.0.1:5432/karyl_e2e
      TEST_E2E_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run every required Plugin Platform path
        run: pnpm --dir e2e required

  create-karyl-plugin-golden-path:
    runs-on: ubuntu-latest
    name: create-karyl-plugin-golden-path
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Run initializer unit tests
        run: pnpm --dir packages/create-karyl-plugin test
      - name: Prove packed initializer and candidate SDK
        run: |
          pnpm --filter "@karyl-chan/plugin-sdk..." build
          pnpm --dir packages/create-karyl-plugin test:packed

  docker-smoke:
    runs-on: ubuntu-latest
    name: Docker smoke build
    needs: build-and-test
    # On PRs only — push to main is covered by publish-bot-image.yml,
    # which builds the same image for real.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/bot/Dockerfile
          push: false
          tags: karyl-chan-bot:ci
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
